name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub Pages kann keine Server-Route ausliefern und keine Testdateien
      # benötigen. Die Wetter-API entfällt für diesen Build; das Wetterpanel
      # erklärt die fehlende Vorhersage.
      - name: Server- und Testcode für den statischen Export entfernen
        run: |
          rm -rf .next src/app/api
          find src -name '*.test.ts' -delete
      - name: Statischen Export bauen
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
